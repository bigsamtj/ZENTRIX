<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phantom – Link Tracker</title>
<link rel="stylesheet" href="assets/css/homepage.css">
</head>
<body>
<div class="container">
  <h1>👻 Phantom</h1>
  <p class="tagline">Silent. Precise. Yours.</p>

  <div class="card">
    <label>Destination URL</label>
    <input type="url" id="target" placeholder="https://example.com" required>
    
    <label>Custom ID (optional)</label>
    <input type="text" id="customId" placeholder="scammer01">
    
    <button id="createBtn">Create Tracking Link</button>
  </div>

  <div id="result" class="card hidden">
    <h3>Your Phantom Link</h3>
    <input type="text" id="outLink" readonly>
    <button id="copyBtn">Copy</button>
    <p><a id="liveLink" href="#" target="_blank">Open Live View</a></p>
  </div>
</div>
<script src="assets/js/homepage.js"></script>
</body>
</html>
